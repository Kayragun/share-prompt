name: Keep alive

# Supabase pauses free-tier projects after about a week without traffic, which
# leaves the site slow and empty. Hitting the site runs its server-side queries,
# which counts as database activity and keeps the project awake.

on:
  schedule:
    - cron: '0 6 */3 * *' # every 3 days at 06:00 UTC
  workflow_dispatch: # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the site
        run: |
          for path in /en /en/categories; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "https://shareprompt-prompt.vercel.app$path")
            echo "$path -> $code"
            if [ "$code" != "200" ]; then
              echo "Expected 200, the site may be down."
              exit 1
            fi
          done
